mbers)\nprint(count, total)\n","prompt":"請自行定義 compute(numbers) 函式，接收一個整數清單，回傳其中「偶數的個數」與「偶數總和」。主程式需讀取資料、呼叫 compute()，並輸出結果。0 也是偶數。","rubric":"輸出與題意及格式完全一致，並符合指定操作要求。","example":""},{"title":"商品編號前綴比較","section":"字串操作與比較","description":"給定兩個長度相同的英數字串 a、b 與正整數 k，依 ASCII／字元編碼的順序比較前 k 個字元；a 的前綴較大時輸出 FIRST，較小時輸出 SECOND，相同時輸出 SAME。若 k 大於字串長度則輸出 error。英文字母大小寫必須區分。","inputDesc":"第一行為 a；第二行為 b；第三行為正整數 k（1 ≤ k ≤ 20）。a、b 都只含 ASCII 英文字母及數字，長度相同（1～20 字元）。","outputDesc":"輸出 FIRST、SECOND、SAME 或 error 四者之一，不得加入其他文字。","constraints":"a、b 長度相同且介於 1～20；1 ≤ k ≤ 20。","hint":"先檢查 k 是否大於 len(a)，否則使用 a[:k] 與 b[:k] 直接比較。","filename":"IM115_PY04.py","publicCount":2,"answer":"a = input().strip()\nb = input().strip()\nk = int(input())\nif k > len(a):\n    print(\"error\")\nelif a[:k] > b[:k]:\n    print(\"FIRST\")\nelif a[:k] < b[:k]:\n    print(\"SECOND\")\nelse:\n    print(\"SAME\")\n","prompt":"給定兩個長度相同的英數字串 a、b 與正整數 k，依 ASCII／字元編碼的順序比較前 k 個字元；a 的前綴較大時輸出 FIRST，較小時輸出 SECOND，相同時輸出 SAME。若 k 大於字串長度則輸出 error。英文字母大小寫必須區分。","rubric":"輸出與題意及格式完全一致，並符合指定操作要求。","example":""},{"title":"交易紀錄彙整","section":"字串解析與資料處理","description":"讀取 n 筆商品交易資料，每筆格式為「名稱,數量,單價」。計算所有交易總金額，以及「單筆交易金額最大」的商品名稱；若單筆金額相同，取名稱按 ASCII 字典順序最小者。","inputDesc":"第一行為整數 n（1 ≤ n ≤ 20）；接下來 n 行為 name,qty,price。name 只含英文字母且長度 1～12；qty 與 price 為 0～999 的整數。","outputDesc":"第一行輸出 TOTAL=總金額（整數）；第二行輸出 TOP=商品名稱。大小寫、等號及換行格式必須一致。","constraints":"1 ≤ n ≤ 20；交易數量與單價介於 0～999；多筆同名視為不同交易紀錄。","hint":"每行使用 split(\",\") 分割，轉為整數後計算 qty * price，並比較 (金額, 品名) 決定最大金額及同分排序。","filename":"IM115_PY05.py","publicCount":3,"answer":"n = int(input())\ntotal = 0\nbest_value = -1\nbest_name = \"\"\nfor _ in range(n):\n    name, qty, price = input().strip().split(\",\")\n    cost = int(qty) * int(price)\n    total += cost\n    if cost > best_value or (cost == best_value and name < best_name):\n        best_value = cost\n        best_name = name\nprint(f\"TOTAL={total}\")\nprint(f\"TOP={best_name}\")\n","prompt":"讀取 n 筆商品交易資料，每筆格式為「名稱,數量,單價」。計算所有交易總金額，以及「單筆交易金額最大」的商品名稱；若單筆金額相 function trapModalKeys(event, root, close){

   if(closed)return;closed=true;dialogRoot.hidden=true;document.body.classList.remove('app-dialog-open');
   document.removeEventListener('keydown',onKey,true);activeAppDialog=null;
   if(prior?.isConnected&&typeof prior.focus==='function')prior.focus({preventScroll:true});

 if(!prep.ok){const v=prep.spec?'WA':'CE';return {status:'graded',verdict:v,score:0,passed:0,total:tests.length,elapsedMs:Date.now()-started,types:{...types,[v]:tests.length},firstFail:{verdict:v,detail:errorTail(prep.error)}};}
 for(let j=0;j<tests.length;j++){
   const t=tests[j];let r,v='AC';
   try{r=await workerCall('run',{input:t.input},3000);}catch(e){if(e.code==='JE')return {status:'JE',detail:e.message,score:null};v=e.code==='TLE'?'TLE':'RE';r={ok:false,output:'',error:e.message};}

   if(v==='AC'&&!r.ok)v='RE';
   if(v==='AC'&&!sameOutput(r.output,t.expected))v='WA';
   types[v]++;if(v==='AC')passed++;else {failures++;if(!firstFail)firstFail={verdict:v,input:t.input,expected:t.expected,actual:r.output||'',detail:errorTail(r.error)}}

     const remaining=tests.length-j-1;types.TLE+=remaining;break;
   }
 }

 const verdict=passed===tests.length?'AC':types.TLE?'TLE':types.CE?'CE':types.RE?'RE':'WA';

 <div id="sampleResult"></div><div id="judgeResult"></div><section class="history"><h3>提交紀錄</h3><div class="history-list" id="historyList"></div></section><div id="judgeProgress" role="status" aria-live="polite"></div><div class="statusbar"><strong id="runtimeStatus">Python：尚未載入</strong> · 首次判題需連網 <button type="button" id="retryRuntime" class="copy-btn">重載</button></div></div></aside></main>
 <div id="fullResults"></div><p class="footer-note">全部 4 回皆為原創練習題（參考資訊月競賽規範與 Python 3 第 2 版操作題章節），「正式測驗」是仿真模式，並非官方真題。公開範例數量為練習設計，非官方固定要求。介面參考 <a href="https://github.com/Ray20123315/ray20123315.github.io/blob/main/md/python/APCS_%E6%A8%A1%E6%93%AC%E8%80%83_01.html" target="_blank" rel="noopener">Ray20123315 GitHub APCS 模擬考</a>，保留 40 分鐘／五題及 Pyodide 自動判題。顯示 JE 代表判題引擎異常，不視為答錯。</p></div>
 <div class="reference-modal" id="referenceModal" hidden><div class="reference-backdrop" id="referenceBackdrop"></div><div class="reference-dialog" role="dialog" aria-modal="true" aria-labelledby="referenceTitle"><div class="reference-head"><strong id="referenceTitle"></strong><button type="button" class="icon-btn" id="referenceClose">關閉</button></div><pre class="reference-code" id="referenceCode" tabindex="0"></pre></div></div>`;
 document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>loadExam(b.dataset.exam));
 $('#start').onclick=async()=>{if(busy)return;if(!await appConfirm('確定重新開始此場考試？只會清除目前場次的作答與結果。'))return;const mode=s.mode;session={...fresh(),mode,started:true,endsAt:mode==='exam'?Date.now()+2400000:0};current=0;save();render()};
 $('#submit').onclick=async()=>{if(await appConfirm('確定交卷並自動批改全部？交卷後不能編輯答案。'))gradeAll(true)};
 $('#export').onclick=exportJson;
 $('#clearRecordsBtn').onclick=async()=>{if(!await appConfirm('確定清空目前這一場的作答與成績？'))return;session=fresh();current=0;save();render()};
 $('#themeBtn').onclick=()=>{currentTheme=currentTheme==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',currentTheme);try{localStorage.setItem(UI_THEME_KEY,currentTheme)}catch{}$('#themeBtn').textContent=currentTheme==='dark'?'淺色模式':'深色模式'};
 $('#freeMode').onchange=e=>{if(ACTIVE.formal)return;session.mode=e.target.checked?'free':'exam';save();render()};
 $('#retryRuntime').onclick=()=>{resetWorker();engineUnavailable=false;setRuntime('Python：準備重載，請按提交／測試')};
 if($('#retry'))$('#retry').onclick=()=>{resetWorker();engineUnavailable=false;for(const i of Object.keys(session.results))if(session.results[i].status==='JE')delete session.results[i];save();gradeAll(true)};
 $('#referenceClose').onclick=$('#referenceBackdrop').onclick=closeReferenceDialog;
 renderQuestion();if(s.started&&!s.finished&&s.mode==='exam')runClock();if(s.finished)renderFinalScore();
}
function renderFinalScore(){const target=$('#fullResults');if(!target)return;target.innerHTML=`<section class="total-result"><h3>自動判題成績</h3><div class="score-number">${score()} <small style="font-size:.9rem;color:var(--muted)">/ 100 分</small></div><p class="smallnote">${pending()?'部分程式尚未成功評測，總分為部分結果，不能視為完整成績。':'此為模擬測資計分，非官方依評分點核定之成績。'}</p>${TASKS.map((t,i)=>`<div class="resultitem"><span>第 ${i+1} 題　${esc(t.title)}</span><strong>${value(i)?.status==='graded'?value(i).score+' / 20':value(i)?.status==='JE'?'JE（待評測）':'0 / 20'}</strong></div>`).join('')}</section>`}
function renderQuestion(){
 const t=TASKS[current],i=current,r=value(i),locked=!session.started||session.finished,publicTests=TESTS[i].slice(0,t.publicCount);
 $('#problemTabs').innerHTML=TASKS.map((q,j)=>`<button type="button" class="problem-tab ${j===i?'active':''} ${value(j)?.verdict==='AC'?'is-ac':''}" data-q="${j}">第 ${j+1} 題｜${esc(q.title)}${value(j)?.status==='graded'?`<span class="problem-tab-verdict">${esc(value(j).verdict)}</span>`:''}</button>`).join('');
 const publicHtml=publicTests.map((ex,j)=>`<div class="sample-card"><div class="sample-head"><h3>範例 ${j+1}</h3><button type="button" class="copy-btn" data-copy-sample="${j}">複製範例輸入</button></div><div class="sample-io"><div class="io-box"><div class="io-label">輸入</div><pre class="codeblock">${esc(ex.input)}</pre></div><div class="io-box"><div class="io-label">輸出</div><pre class="codeblock">${esc(ex.expected)}</pre></div></div></div>`).join('');
 $('#problemPane').innerHTML=`<div class="kicker">第 ${i+1} 大題 · ${esc(t.section)}</div><h2 class="problem-title">${esc(t.title)}</h2>
 <section class="section"><h2>1. 題目說明</h2><p>請依照下列要求撰寫 Python 3 程式。完成後請將程式存為 <code>${esc(t.filename)}</code>（此為練習用指定檔名，不是正式試卷檔名）。</p></section>
 <section class="section"><h2>2. 設計說明</h2><p>${esc(t.description)}</p></section>
 <section class="section"><h2>3. 輸入輸出</h2><p><strong>輸入說明：</strong>${esc(t.inputDesc)}</p><p><strong>輸出說明：</strong>${esc(t.outputDesc)}</p><p><strong>資料範圍：</strong>${esc(t.constraints)}</p></section>
 <section class="section"><h2>公開範例（${publicTests.length} 組）</h2><div class="sample-list">${publicHtml}</div><p class="smallnote">公開範例與隱藏測資均會參與本網站自動判題；未公開測資 ${TESTS[i].length-publicTests.length} 組。公開範例數量由本練習題目需求決定，非官方固定題數。</p></section>
 <section class="section"><h2>4. 評分說明</h2><p>本題滿分 <strong>20 分</strong>。本網站以 ${TESTS[i].length} 組測資的輸出正確率模擬評分；大小寫、空白、換行須完全一致（不同作業系統的換行碼視為相同）。${t.requiredFunction?' 此題另檢查是否定義 '+esc(t.requiredFunction)+'() 函式。':''}實際資訊月依官方標準答案「評分點」計分，與本站測資比例評分不一定相同。</p></section>
 ${ACTIVE.formal&&!session.finished?'<p class="smallnote">正式測驗模式：提示與參考解答將在交卷後開放。</p>':`<details class="hint-details" ${session.reveal['h'+i]?'open':''} data-reveal="h"><summary>解題提示（練習用途）</summary><p>${esc(t.hint)}</p></details>`}<p class="smallnote">第 ${i+1} 題 · 練習用檔名：${esc(t.filename)} · 請養成存檔習慣。</p>`;
 $('#submitTitle').textContent=`第 ${i+1} 題繳交｜${t.title}`;
 $('#bestScore').textContent=`${r?.status==='graded'?r.score:0}/20`;
 $('#latestScore').textContent=r?.status==='graded'?`${r.score}/20`:r?.status==='JE'?'JE':r?.status==='unsubmitted'?'未作答':'尚未提交';
 const state=r?.status==='JE'?'environment':r?.status==='graded'?(r.verdict==='AC'?'good':'bad'):'';
 $('#statusLine').className='status-line '+state;
 $('#statusLine').textContent=r?.status==='JE'?'判題環境無法載入（JE），本次不計分':r?.status==='graded'?`評測結束：${r.verdict}｜通過 ${r.passed}/${r.total} 組｜${r.score}/20 分`:r?.status==='unsubmitted'?'未作答':'尚未提交檔案。';
 $('#progressTrack').dataset.verdict=r?.verdict||(r?.status==='JE'?'JE':'IDLE');$('#progressBar').style.width=r?'100%':'0%';
 $('#workArea').value=ans(i);$('#workArea').disabled=locked;
 $('#viewerName').textContent=t.filename+' · 可編輯／可下載';
 $('#judgeResult').innerHTML=resultHtml(i);
 $('#historyList').innerHTML=r?`<div class="history-row"><div><strong>${esc(t.filename)}</strong><br><small>最近一次 · ${esc(r.verdict||r.status||'—')}</small></div><strong>${r.score==null?'JE':r.score+'/20'}</strong></div>`:'<div class="history-row"><small>尚無提交紀錄</small><span></span></div>';
 $('#problemPane').querySelectorAll('[data-copy-sample]').forEach(b=>b.onclick=()=>{const ex=publicTests[Number(b.dataset.copySample)];navigator.clipboard?.writeText(ex.input).then(()=>toastNotice('已複製範例輸入')).catch(()=>toastNotice('複製失敗，請手動選取文字','error'))});
 $('#copyCodeBtn').onclick=()=>{navigator.clipboard?.writeText($('#workArea').value).then(()=>toastNotice('已複製 Python 程式碼')).catch(()=>toastNotice('複製失敗，請手動選取文字','error'))};
 $('#downloadPyBtn').onclick=()=>{const contents=$('#workArea').value;if(!contents.trim()){appAlert('請先輸入 Python 程式碼。');return;}const blob=new Blob([contents],{type:'text/x-python;charset=utf-8'}),url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=t.filename;a.click();toastNotice('已啟動 .py 檔案下載');setTimeout(()=>URL.revokeObjectURL(url),1000)};
 $('#workArea').oninput=e=>{session.answers[i]=e.target.value;delete session.results[i];save();refreshStats();$('#judgeResult').innerHTML=resultHtml(i);$('#statusLine').className='status-line';$('#statusLine').textContent='程式碼已變更，請重新提交本題。';$('#latestScore').textContent='待評測';$('#bestScore').textContent='0/20';$('#progressTrack').dataset.verdict='IDLE';$('#progressBar').style.width='0%';$('#historyList').innerHTML='<div class="history-row"><small>目前程式碼尚未評測</small></div>'};
 $('#testSample').onclick=runSample;$('#judgeOne').onclick=()=>gradeOne(i);
 $('#referenceAnswerBtn').onclick=()=>{if(ACTIVE.formal&&!session.finished)return;$('#referenceTitle').textContent=`第 ${i+1} 題參考答案｜${t.title}`;$('#referenceCode').textContent=t.answer;openReferenceDialog()};
 const upload=$('#uploadZone');const loadFile=async(file)=>{if(!file)return;if(!/\.py$/i.test(file.name)){appAlert('請選擇 .py 程式檔');return;}if(file.size>128*1024){appAlert('檔案不得超過 128 KiB');return;}if(locked||busy)return;if(file.name!==t.filename){appAlert('本題練習要求檔名 '+t.filename+'；目前檔案為 '+file.name+'。請重新命名後再上傳，模擬正式競賽存檔規範。');return;}try{const text=await file.text();session.answers[i]=text;delete session.results[i];save();$('#workArea').value=text;$('#viewerName').textContent=file.name+' · 已匯入';await gradeOne(i)}catch(e){appAlert('檔案讀取失敗：'+e.message)}};
 $('#uploadBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=e=>{loadFile(e.target.files?.[0]);e.target.value=''};
 upload.ondragover=e=>{e.preventDefault();upload.classList.add('drag')};upload.ondragleave=()=>upload.classList.remove('drag');upload.ondrop=e=>{e.preventDefault();upload.classList.remove('drag');loadFile(e.dataTransfer.files?.[0])};
 $('#problemTabs').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>navigate(Number(b.dataset.q)));
 $('#problemPane').querySelectorAll('[data-reveal]').forEach(d=>d.ontoggle=()=>{session.reveal[d.dataset.reveal+i]=d.open;save()});
 refreshStats();
}
function refreshStats(){const d=$('#doneCount'),z=$('#liveScore'),scoreLabel=$('#overallScore');if(d)d.textContent=`已作答 ${doneCount()}/5`;if(z)z.textContent=`自動評測 ${score()}/100${pending()?' · 部分未評測':''}`;if(scoreLabel)scoreLabel.textContent=`${score()}/100`}
function navigate(i){if(busy||i<0||i>=TASKS.length)return;current=i;renderQuestion();}

render();
</script></body></html>

# Reuse the forked repository's original PEICD100 MkDocs theme and extensions.
# Only navigation, publishing scope and site identity differ from the upstream fork.
INHERIT: mkdocs.yml
site_name: Python × C++ 學習中心
site_url: https://ray20123315.github.io/
site_description: Python 筆記及 C++ 零基礎資訊學科能力競賽教學
docs_dir: _python_docs
site_dir: _python_public
use_directory_urls: false
not_in_nav: ''

# Keep upstream theme assets alongside independent C++ practice scripts.
extra_css:
  - assets/pymdownx-extras/extra-8611f6c398.css
  - assets/pymdownx-extras/自定義.css?v=20260614-2
  - assets/cpp-practice.css
  - assets/cpp-mock-exam.css
extra_javascript:
  - assets/pymdownx-extras/conditional-loader.js?v=20261007-1
  - assets/cpp-practice.js
  - assets/cpp-mock-exam.js

# Restrict publication-specific plugins to Python content.
# Theme, custom_dir, features, palette, markdown extensions and original hooks
# are inherited from mkdocs.yml (which inherits docs/.mkdocs/site.yml).
plugins:
  - tags
  - search:
      separator: '[\\s\\u200b\\-]'


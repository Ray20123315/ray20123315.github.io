name: Deploy Python and C++ Learning

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: learning-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout forked template and Python notes
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/.mkdocs/site.yml
            docs/md/python
            docs/md/cpp
            docs/portal.md
            docs/logo/logo.png
            mkdocs.yml
            mkdocs.python.yml
            theme
            tools
            setup.py
            requirements.txt
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install forked template dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Stage Python-only pages
        run: |
          mkdir -p _python_docs/md/python _python_docs/md/cpp _python_docs/assets _python_docs/logo
          find docs/md/python -maxdepth 1 -type f \( -name '*.md' -o -name '*.html' \) -exec cp -t _python_docs/md/python/ {} +
          find docs/md/cpp -maxdepth 1 -type f -name '*.md' -exec cp -t _python_docs/md/cpp/ {} +
          cp docs/portal.md _python_docs/index.md
          cp docs/logo/logo.png _python_docs/logo/logo.png
          cp -a theme/assets/. _python_docs/assets/
          cp -a docs/md/cpp/assets/. _python_docs/assets/
          test "$(find _python_docs/md/python -type f -name '*.md' | wc -l)" -eq 20
          test "$(find _python_docs/md/cpp -type f -name '*.md' | wc -l)" -eq 24
          test "$(find _python_docs/md/python -type f -name '*.html' | wc -l)" -eq 33

      - name: Build using inherited forked template
        run: python -m mkdocs build --config-file mkdocs.python.yml

      - name: Verify Python/C++ pages and fork styling
        run: |
          test -f _python_public/index.html
          test -f _python_public/md/python/首頁.html
          test -f _python_public/md/python/輸出與資料存取.html
          test -f _python_public/md/python/f580_骰子.html
          test -f _python_public/md/cpp/00-學習地圖.html
          test -f _python_public/md/cpp/01-第一支程式.html
          test -f _python_public/md/cpp/23-模擬測驗.html
          test -f _python_public/search/search_index.json
          test ! -e _python_public/blog
          test ! -e _python_public/md/人工智慧
          test ! -e _python_public/md/演算法筆記
          python - <<'PY'
          from pathlib import Path
          home = Path('_python_public/index.html').read_text(encoding='utf-8')
          assert 'md-header' in home, 'Forked Material header not rendered'
          assert 'Python' in home and 'C++' in home
          assert 'peicd100.github.io/md/python' not in home
          assets = Path('_python_public/assets/pymdownx-extras')
          assert any(f.suffix == '.css' for f in assets.iterdir()), 'Original CSS missing'
          assert (assets / 'material-extra-theme-2ek1P7jT.js').is_file(), 'Original theme script missing'
          PY

      - name: Validate all progressive lessons and original C++ examples
        run: |
          node --check docs/md/cpp/assets/cpp-practice.js
          python tools/verify_cpp_progression.py
          python - <<'PY'
          from pathlib import Path
          pages=Path('_python_public/md/cpp')
          for i in range(1,24):
              matches=list(pages.glob(f'{i:02d}-*.html'))
              assert len(matches)==1,(i,matches)
              assert 'data-cpp-practice=' in matches[0].read_text(encoding='utf-8'),matches[0]
          for name in ('cpp-practice.js','cpp-practice.css','cpp-practice-data.json'):
              assert Path('_python_public/assets',name).is_file(),name
          home=Path('_python_public/md/cpp/00-學習地圖.html').read_text(encoding='utf-8')
          assert 'data-cpp-overview' in home
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Python/C++ site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _python_public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

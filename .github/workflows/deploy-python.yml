name: Deploy Python and C++ Learning

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: learning-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout forked template and Python notes
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/.mkdocs/site.yml
            docs/md/python
            docs/md/cpp
            docs/portal.md
            docs/logo/logo.png
            mkdocs.yml
            mkdocs.python.yml
            theme
            tools
            setup.py
            requirements.txt
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install forked template dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Stage Python-only pages
        run: |
          mkdir -p _python_docs/md/python _python_docs/md/cpp _python_docs/assets _python_docs/logo
          find docs/md/python -maxdepth 1 -type f \( -name '*.md' -o -name '*.html' \) -exec cp -t _python_docs/md/python/ {} +
          find docs/md/cpp -maxdepth 1 -type f \( -name '*.md' -o -name '*.html' \) -exec cp -t _python_docs/md/cpp/ {} +
          cp docs/portal.md _python_docs/index.md
          cp docs/logo/logo.png _python_docs/logo/logo.png
          cp -a theme/assets/. _python_docs/assets/
          cp -a docs/md/cpp/assets/. _python_docs/assets/
          test "$(find _python_docs/md/python -type f -name '*.md' | wc -l)" -eq 20
          test "$(find _python_docs/md/cpp -type f -name '*.md' | wc -l)" -eq 24
          test "$(find _python_docs/md/cpp -type f -name '*.html' | wc -l)" -eq 2
          test "$(find _python_docs/md/python -type f -name '*.html' | wc -l)" -eq 33

      - name: Build using inherited forked template
        run: python -m mkdocs build --config-file mkdocs.python.yml

      - name: Verify Python/C++ pages and fork styling
        run: |
          test -f _python_public/index.html
          test -f _python_public/md/python/首頁.html
          test -f _python_public/md/python/輸出與資料存取.html
          test -f _python_public/md/python/f580_骰子.html
          test -f _python_public/md/cpp/00-學習地圖.html
          test -f _python_public/md/cpp/01-第一支程式.html
          test -f _python_public/md/cpp/23-模擬測驗.html
          test -f _python_public/md/cpp/24-漸進式練習.html
          test -f _python_public/md/cpp/25-模擬考中心.html
          test -f _python_public/search/search_index.json
          test ! -e _python_public/blog
          test ! -e _python_public/md/人工智慧
          test ! -e _python_public/md/演算法筆記
          python - <<'PY'
          from pathlib import Path
          home = Path('_python_public/index.html').read_text(encoding='utf-8')
          assert 'md-header' in home, 'Forked Material header not rendered'
          assert 'Python' in home and 'C++' in home
          assert 'peicd100.github.io/md/python' not in home
          assets = Path('_python_public/assets/pymdownx-extras')
          assert any(f.suffix == '.css' for f in assets.iterdir()), 'Original CSS missing'
          assert (assets / 'material-extra-theme-2ek1P7jT.js').is_file(), 'Original theme script missing'
          PY

      - name: Validate all progressive lessons and original C++ examples
        run: |
          node --check docs/md/cpp/assets/cpp-practice.js
          node --check docs/md/cpp/assets/cpp-mock-exam.js
          node --check docs/md/cpp/assets/cpp-standalone.js
          node --check docs/md/cpp/assets/cpp-tutor.js
          node --check docs/md/cpp/assets/cpp-inline-compiler.js
          python tools/verify_cpp_tutors.py
          python tools/verify_cpp_progression.py
          python - <<'PY'
          from pathlib import Path
          pages=Path('_python_public/md/cpp')
          for i in range(1,24):
              matches=list(pages.glob(f'{i:02d}-*.html'))
              assert len(matches)==1,(i,matches)
              assert 'data-cpp-practice=' in matches[0].read_text(encoding='utf-8'),matches[0]
          for name, mode in [
              ('24-漸進式練習.html', 'practice'),
              ('25-模擬考中心.html', 'exam'),
          ]:
              html=(pages / name).read_text(encoding='utf-8')
              assert html.lstrip().lower().startswith('<!doctype html>'),name
              assert f'data-app="{mode}"' in html,name
              assert 'class="topbar"' in html and 'id="panel"' in html,name
              assert '../../assets/cpp-standalone.js' in html,name
              assert '../../assets/cpp-standalone.css' in html,name
              assert '../../assets/cpp-inline-compiler.js' in html,name
              assert '../../assets/cpp-inline-compiler.css' in html,name
              assert 'id="layout-toggle"' in html,name
              if mode == 'practice':
                  assert '../../assets/cpp-tutor.js' in html,name
                  assert '../../assets/cpp-tutor.css' in html,name
              assert 'md-header' not in html,name
          for name in ('cpp-practice.js','cpp-practice.css','cpp-practice-data.json','cpp-mock-exam.js','cpp-mock-exam.css','cpp-standalone.js','cpp-standalone.css','cpp-tutor.js','cpp-tutor.css','cpp-tutor-data.json','cpp-inline-compiler.js','cpp-inline-compiler.css'):
              assert Path('_python_public/assets',name).is_file(),name
          css=(Path('_python_public/assets/cpp-inline-compiler.css')).read_text(encoding='utf-8')
          layout=(Path('_python_public/assets/cpp-standalone.css')).read_text(encoding='utf-8')
          runtime=(Path('_python_public/assets/cpp-inline-compiler.js')).read_text(encoding='utf-8')
          source=(Path('_python_public/assets/cpp-standalone.js')).read_text(encoding='utf-8')
          assert 'aspect-ratio:16 / 9' in css, 'Compiler 16:9 ratio missing'
          assert '.ic-expanded' in css and 'ic-backdrop' in runtime, 'Full-size compiler missing'
          assert 'data-layout="wide"' in layout, 'Compact desktop stylesheet missing'
          assert 'STORAGE_LAYOUT' in source and 'applyLayout(' in source, 'Persistent compact layout toggle missing'
          tutor_js=Path('_python_public/assets/cpp-tutor.js').read_text(encoding='utf-8')
          tutor_css=Path('_python_public/assets/cpp-tutor.css').read_text(encoding='utf-8')
          assert 'function workbench(' in tutor_js, 'Tutor side-by-side layout missing'
          assert 'body.append(workbench(' in tutor_js, 'Tutor steps not using workbench'
          assert 'viewport.scrollTop=0' in tutor_js, 'Stage scroll reset missing'
          assert '.tl-workbench' in tutor_css and 'grid-template-columns:' in tutor_css, 'Two-column CSS missing'
          assert 'tl-explain-pane' in tutor_css and 'tl-code-pane' in tutor_css, 'Code/explanation panes missing'
          assert '@media(max-width:950px)' in tutor_css, 'Small-screen single-column fallback missing'
          assert 'openExpanded' in runtime and 'document.body.append(card)' in runtime, 'Editor overlay not reachable'
          print('PASS: 16:9 side-by-side tutor, source pane, explainer pane, scroll reset and overlay')
          print('PASS: 16:9 desktop focus, compiler aspect ratio, expanded view, mobile fallback')
          home=Path('_python_public/md/cpp/00-學習地圖.html').read_text(encoding='utf-8')
          assert 'data-cpp-overview' in home
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Python/C++ site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _python_public

      # If GitHub Pages is still configured for branch-based publishing, GitHub
      # also launches a separate "pages build and deployment" run on each push.
      # Deploy only after that run has ended so it cannot overwrite this site.
      # If Pages source is set to GitHub Actions, the legacy run is absent and
      # this step exits immediately.
      - name: Wait for legacy Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          uri = f"https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=50"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "cpp-learning-pages-workflow",
          }
          for attempt in range(40):
              request = urllib.request.Request(uri, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.load(response)
              legacy = [
                  run for run in payload.get("workflow_runs", [])
                  if run.get("name") == "pages build and deployment"
                  and run.get("event") == "dynamic"
                  and run.get("head_sha") == sha
              ]
              if not legacy:
                  print("No branch-based Pages run for this commit; proceeding.", flush=True)
                  break
              pending = [run for run in legacy if run.get("status") != "completed"]
              if not pending:
                  print("Branch-based Pages run completed; deploying correct MkDocs site next.", flush=True)
                  break
              print(f"Waiting for {len(pending)} branch-based Pages run(s) to finish...", flush=True)
              time.sleep(10)
          else:
              raise SystemExit("Branch-based Pages run did not finish within 400 seconds.")
          PY

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

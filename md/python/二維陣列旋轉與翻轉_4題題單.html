<style>

.wrap{width:min(1500px,100%);margin:0 auto;padding:18px 22px 38px}

.icon-btn{height:38px;border-radius:11px;padding:0 12px;font-size:.82rem;font-weight:650}.icon-btn:not(:disabled):hover,.copy-btn:not(:disabled):hover,.resubmit-btn:not(:disabled):hover{border-color:var(--line-strong);background:var(--panel3)}.icon-btn.danger{border-color:color-mix(in srgb,var(--bad) 35%,var(--line));color:var(--bad)}.icon-btn.danger:not(:disabled):hover{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 58%,var(--line))}

.table-scroll{overflow:auto;padding:10px}.matrix-visual,.coord-visual{border-collapse:separate;border-spacing:0;margin:auto;font-family:"Cascadia Mono","Cascadia Code",Consolas,monospace;font-size:.78rem;border:1px solid var(--line);border-radius:9px;overflow:hidden}.matrix-visual th,.matrix-visual td,.coord-visual th,.coord-visual td{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:40px;text-align:center;padding:7px 8px}.matrix-visual tr:last-child>*,.coord-visual tr:last-child>*{border-bottom:0}.matrix-visual tr>*:last-child,.coord-visual tr>*:last-child{border-right:0}.matrix-visual th,.coord-visual th{background:var(--panel3);font-weight:800;color:var(--muted)}.matrix-visual td,.coord-visual td{background:var(--panel)}.matrix-visual td small{display:block;font-family:inherit;font-size:.64rem;color:var(--muted);margin-top:4px}.matrix-visual td.wall{background:repeating-linear-gradient(45deg,var(--panel2),var(--panel2) 5px,var(--line) 5px,var(--line) 7px)}.matrix-visual td.robot{outline:2px solid var(--accent);outline-offset:-3px;background:var(--panel3)}.coord-cell.point{background:var(--panel3);font-weight:800;color:var(--text-strong)}
.equation-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}.equation-card{border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:var(--panel2);display:grid;gap:5px}.equation-card span{font-family:"Cascadia Mono","Cascadia Code",Consolas,monospace;font-size:.76rem;overflow-wrap:anywhere}
.visual-sequence{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));align-items:stretch;gap:9px;padding:11px;max-width:100%}.visual-state-card{min-width:0;max-width:none;border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:9px;display:flex;flex-direction:column;justify-content:flex-start}.state-label{font-size:.76rem;font-weight:900;text-align:center;color:var(--accent);margin-bottom:4px}.state-meta,.visual-caption-note{font-size:.74rem;line-height:1.58;color:var(--muted);margin:6px 2px 0}.visual-arrow{align-self:center;flex:0 0 auto;font-size:1.1rem;font-weight:900;color:var(--accent);padding:0 1px}.map-visual td{min-width:46px;height:46px;padding:4px}.map-visual td.visited{background:var(--panel3)}.visual-legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 11px 11px;color:var(--muted);font-size:.71rem}.visual-legend span{display:inline-flex;align-items:center;gap:5px}.legend-swatch{display:inline-block;width:13px;height:13px;border:1px solid var(--line);border-radius:4px}.visited-swatch{background:var(--panel3)}.robot-swatch{background:var(--panel3);outline:2px solid var(--accent);outline-offset:-2px}.manhattan-map td.route-cell{font-weight:900;color:var(--accent);background:var(--panel3)}.candidate-point strong{color:var(--accent)}.kernel-map td.kernel-hit{background:var(--panel3);font-weight:800}.kernel-map td.kernel-center{background:var(--panel3);outline:2px solid var(--accent);outline-offset:-3px;font-weight:900}.matrix-visual td.scan-best{background:var(--panel3);outline:2px solid var(--accent);outline-offset:-3px;font-weight:900}.trace-table td{vertical-align:top}
.submit-body{padding:18px}.upload-zone{border:1px dashed color-mix(in srgb,var(--accent) 34%,var(--line));border-radius:14px;padding:15px;text-align:center;background:var(--panel2);transition:border-color .14s ease,background-color .14s ease}.upload-zone.drag{border-color:var(--accent);background:var(--panel3)}.upload-actions{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap}.upload-btn,.resubmit-btn,.reference-btn{min-height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;padding:9px 12px;font-size:.84rem;font-weight:780}.upload-btn{border:1px solid color-mix(in srgb,var(--accent) 62%,var(--line));background:var(--panel3);color:var(--accent)}.upload-btn:not(:disabled):hover{border-color:var(--accent);background:color-mix(in srgb,var(--panel3) 88%,white 12%)}.resubmit-btn,.reference-btn{border:1px solid var(--line);background:var(--panel2);color:var(--text)}.reference-btn{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));color:var(--accent)}.reference-btn[hidden]{display:none!important}.upload-btn:disabled,.resubmit-btn:disabled,.reference-btn:disabled{opacity:.46;cursor:not-allowed;filter:none}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:15px 0}.metric{border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--panel2)}.metric small{display:block;color:var(--muted);font-size:.67rem;font-weight:700;letter-spacing:.04em}.metric strong{display:block;margin-top:5px;font-size:1.16rem;letter-spacing:-.025em;color:var(--text-strong)}
.status-line{border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:44px;font-size:.82rem;line-height:1.58;background:var(--panel2)}.status-line.good{border-color:color-mix(in srgb,var(--good) 42%,var(--line));color:var(--good);background:var(--good-soft)}.status-line.bad{border-color:color-mix(in srgb,var(--bad) 42%,var(--line));color:var(--bad);background:var(--bad-soft)}
.progress{height:6px;background:var(--panel3);border-radius:999px;overflow:hidden;margin:10px 1px 0;border:1px solid var(--line-soft)}.progress>span{display:block;height:100%;width:0;background:var(--accent);transition:width .18s ease}
.viewer-card{margin-top:15px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--code)}.viewer-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 11px;background:var(--panel2);border-bottom:1px solid var(--line)}.viewer-head strong{font-size:.76rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}.code-viewer{margin:0;min-height:230px;max-height:430px;overflow:auto;padding:15px 16px;background:var(--code);color:var(--code-text);font-family:"Cascadia Mono","Cascadia Code",Consolas,monospace;font-size:.8rem;line-height:1.62;white-space:pre;tab-size:4}.empty-code{color:#758691}
.history{margin-top:16px}.history h3{font-size:.82rem;margin:0 0 9px;color:var(--text-strong)}.history-list{display:grid;gap:8px;max-height:220px;overflow:auto;padding-right:2px}.history-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;border:1px solid var(--line);border-radius:11px;padding:9px 10px;background:var(--panel2);font-size:.75rem;transition:border-color .14s ease,background-color .14s ease}.history-row:hover{border-color:var(--line-strong);background:var(--panel3)}.history-row small{color:var(--muted)}.history-row>strong{color:var(--accent)}
.storage-warning{display:none;margin:11px 0 0;padding:9px 10px;border-radius:10px;background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 26%,var(--line));font-size:.73rem}.storage-warning.show{display:block}
.reference-modal[hidden]{display:none}.reference-modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px}.reference-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.78)}.reference-dialog{position:relative;width:min(920px,100%);max-height:min(84vh,820px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line-strong);border-radius:20px;box-shadow:var(--shadow-lg);overflow:hidden}.reference-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}.reference-head strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-strong)}.reference-actions{display:flex;gap:8px;flex-wrap:wrap}.reference-code{margin:0;min-height:280px;overflow:auto;padding:18px;background:var(--code);color:var(--code-text);font-family:"Cascadia Mono","Cascadia Code",Consolas,monospace;font-size:.82rem;line-height:1.64;white-space:pre;tab-size:4}

/* Verdict feedback: neutral surfaces, colored foreground/borders only. */
:root{--judge-environment:#7953b4}
html[data-theme="dark"]{--judge-environment:#c4b5fd}
.problem-tab{position:relative}
.problem-tab-verdict{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;margin-left:8px;padding:2px 5px;border:1px solid currentColor;border-radius:5px;font-family:"Cascadia Mono",Consolas,monospace;font-size:.62rem;font-weight:850;line-height:1.2;letter-spacing:.02em;color:var(--good);vertical-align:middle}
.problem-tab-verdict[hidden]{display:none!important}
.problem-tab.is-ac,.problem-tab.is-ac:not(.active):hover{color:var(--good);border-color:color-mix(in srgb,var(--good) 58%,var(--line));background:var(--panel2)}
.problem-tab.is-ac.active{color:var(--good);border-color:var(--good);background:var(--panel3)}
.problem-tab.is-ac .problem-tab-index,.problem-tab.is-ac:not(.active):hover .problem-tab-index{color:var(--good);border-color:color-mix(in srgb,var(--good) 65%,var(--line))}
.exam-shell .problem-tab.is-ac{grid-template-columns:30px minmax(0,1fr) auto}
.exam-shell .problem-tab-verdict{margin-left:0}
.progress>span{transition:width .18s ease,background-color .18s ease}
.progress[data-verdict="IDLE"]>span{background:var(--muted)}
.progress[data-verdict="RUNNING"]>span{background:var(--accent)}
.progress[data-verdict="AC"]>span{background:var(--good)}
.progress[data-verdict="WA"]>span,.progress[data-verdict="CE"]>span,.progress[data-verdict="RE"]>span{background:var(--bad)}
.progress[data-verdict="TLE"]>span{background:var(--warn)}
.progress[data-verdict="JE"]>span{background:var(--judge-environment)}
.status-line.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 42%,var(--line));background:var(--warn-soft)}
.status-line.environment{color:var(--judge-environment);border-color:color-mix(in srgb,var(--judge-environment) 42%,var(--line));background:var(--panel2)}
@media(max-width:700px){.exam-shell .problem-tab{flex-direction:column;gap:3px}.exam-shell .problem-tab-verdict{font-size:.53rem;padding:1px 3px}}

</style>
</head>
<body>
<div class="topbar"><div class="topbar-inner">
  <div class="brand"><h1 id="examTitle">APCS 模擬考</h1><p id="examSubtitle"></p></div>
  <div class="top-actions">
    <label class="mode-key-wrap" aria-label="模式切換"><input id="modeKeyInput" class="mode-key-input" type="text" inputmode="numeric" autocomplete="off" maxlength="4" aria-label="模式切換"><span id="modeKeyMask" class="mode-key-mask" aria-hidden="true"></span></label>
    <div class="score-pill">總分 <strong id="overallScore">0/400</strong></div>
    <button class="icon-btn" id="exportRecordsBtn" type="button">匯出紀錄</button>
    <button class="icon-btn" id="importRecordsBtn" type="button">匯入紀錄</button>
    <input id="recordImportInput" type="file" accept=".json,application/json" hidden>
    <button class="icon-btn danger" id="clearRecordsBtn" type="button">清空紀錄</button>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="切換深淺色">淺色模式</button>
  </div>

<script>
'use strict';
const EXAM = JSON.parse(document.getElementById('examData').textContent);
const PYODIDE_VERSION='0.27.7';
const PYODIDE_BASE_URL=`https://cdn.jsdelivr.net/pyodide/v${PYODIDE_VERSION}/full/`;
const MAX_FILE_BYTES=128*1024;
const MAX_RECORD_FILE_BYTES=5*1024*1024;
const RECORD_FORMAT='PEICD_APCS_MOCK_EXAM_RECORD';
const RECORD_SCHEMA_VERSION=2;
const LEGACY_RECORD_SCHEMA_VERSION=1;
const PER_TEST_TIMEOUT_MS=2500;
const RUNTIME_INIT_TIMEOUT_MS=25000;
const MODE_GENERAL='general';
const MODE_GRADING='grading';
const MODE_KEY_PROXY='批改模式';
let activeIndex=0;
let judging=false;
let activeJudgeView=null;
let pyWorker=null;
let workerReadyPromise=null;
let workerSeq=0;
let memoryStore={};
let storagePersistent=true;
let modeKeyValue='0000';
const $=s=>document.querySelector(s);
const problemById=id=>EXAM.problems.find(p=>p.id===id);
function escapeHtml(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1500);}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('已複製');return true;}catch(_){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();toast(ok?'已複製':'複製失敗');return ok;}}
function storageKey(){return EXAM.exam.storageNamespace;}
function modePreferenceKey(){return storageKey()+':mode';}
function probeStorage(){try{const k='__peicd_probe__'+Math.random();localStorage.setItem(k,'1');if(localStorage.getItem(k)!=='1')throw new Error();localStorage.removeItem(k);storagePersistent=true;}catch(e){storagePersistent=false;$('#storageWarning').classList.add('show');}}
function emptyModeState(){return {best:{},latest:{},history:{}};}
function emptyState(){return {modes:{[MODE_GENERAL]:emptyModeState(),[MODE_GRADING]:emptyModeState()},lastSource:{}};}
function isPlainObject(v){return !!v&&typeof v==='object'&&!Array.isArray(v);}
function cloneModeState(raw){return {best:isPlainObject(raw&&raw.best)?raw.best:{},latest:isPlainObject(raw&&raw.latest)?raw.latest:{},history:isPlainObject(raw&&raw.history)?raw.history:{}};}
function inferLastSourceFromLegacy(latest){const out={};if(!isPlainObject(latest))return out;for(const [id,v] of Object.entries(latest)){if(v&&typeof v.code==='string'&&typeof v.filename==='string')out[id]={time:typeof v.time==='string'?v.time:'',filename:v.filename,code:v.code};}return out;}
function migrateStoredState(obj){
 const out=emptyState();if(!isPlainObject(obj))return out;
 if(isPlainObject(obj.modes)){
   out.modes[MODE_GENERAL]=cloneModeState(obj.modes[MODE_GENERAL]);
   out.modes[MODE_GRADING]=cloneModeState(obj.modes[MODE_GRADING]);
   out.lastSource=isPlainObject(obj.lastSource)?obj.lastSource:{};
   return out;
 }
 // Legacy mock state was always the full 100-point Judge, so preserve it under grading mode.
 out.modes[MODE_GRADING]=cloneModeState(obj);
 out.lastSource=inferLastSourceFromLegacy(obj.latest);
 return out;
}
function loadState(){const empty=emptyState();try{const raw=storagePersistent?localStorage.getItem(storageKey()):memoryStore[storageKey()];if(!raw)return empty;return migrateStoredState(JSON.parse(raw));}catch(e){return empty;}}
let STATE=emptyState();
function saveState(){const raw=JSON.stringify(STATE);try{if(storagePersistent)localStorage.setItem(storageKey(),raw);else memoryStore[storageKey()]=raw;}catch(e){storagePersistent=false;memoryStore[storageKey()]=raw;$('#storageWarning').classList.add('show');}}
function saveModePreference(mode){const key=modePreferenceKey();try{if(storagePersistent)localStorage.setItem(key,mode);else memoryStore[key]=mode;}catch(e){storagePersistent=false;memoryStore[key]=mode;$('#storageWarning').classList.add('show');}}
function applyModePreference(mode,persist=true,render=true){const normalized=mode===MODE_GENERAL?MODE_GENERAL:MODE_GRADING,raw=normalized===MODE_GRADING?'0000':'';modeKeyValue=raw;const input=$('#modeKeyInput');if(input)input.value=raw;const mask=$('#modeKeyMask');if(mask)mask.textContent=MODE_KEY_PROXY.slice(0,raw.length);const wrap=$('.mode-key-wrap');if(wrap)wrap.classList.toggle('has-value',raw.length>0);if(persist)saveModePreference(normalized);if(render)renderSubmit();}
function initModePreference(){let mode=MODE_GRADING;try{const key=modePreferenceKey(),saved=storagePersistent?localStorage.getItem(key):memoryStore[key];if(saved===MODE_GENERAL||saved===MODE_GRADING)mode=saved;}catch(e){}applyModePreference(mode,false,false);}
function currentMode(){return modeKeyValue==='0000'?MODE_GRADING:MODE_GENERAL;}
function modeMaxScore(p,mode=currentMode()){return mode===MODE_GRADING?p.score:p.samples.length;}
function examMaxScore(mode=currentMode()){return mode===MODE_GRADING?EXAM.exam.totalScore:EXAM.problems.reduce((sum,p)=>sum+p.samples.length,0);}
function modeTests(p,mode=currentMode()){return mode===MODE_GRADING?p.judgeTests:p.samples;}
function currentModeState(){return STATE.modes[currentMode()];}
function scoreValue(value,max,allowNull=false){
 if(allowNull&&value===null)return null;
 const n=Number(value);if(!Number.isInteger(n)||n<0||n>max)throw new Error('分數資料不合法');return n;
}
function safeText(value,label,maxLen){if(typeof value!=='string'||value.length>maxLen)throw new Error(label+' 不合法');return value;}
function normalizeLatest(latest,p,maxScore){
 if(latest==null)return null;
 if(!isPlainObject(latest))throw new Error(`${p.id} 最近一次紀錄格式不正確`);
 const code=safeText(latest.code,'程式碼',MAX_FILE_BYTES*2);if(new Blob([code]).size>MAX_FILE_BYTES)throw new Error(`${p.id} 程式碼超過大小限制`);
 const result={time:safeText(latest.time,'時間',80),filename:safeText(latest.filename,'檔名',255),score:scoreValue(latest.score,maxScore,true),code,summary:safeText(latest.summary,'結果摘要',4000),errorKind:typeof latest.errorKind==='string'?latest.errorKind:''};
 if(latest.verdict!=null){const value=safeText(latest.verdict,'Verdict',120);if(!verdictCode(value))throw new Error('Verdict 不合法');result.verdict=value;}
 return result;
}
function normalizeHistory(hist,p,maxScore){
 if(hist==null)return [];
 if(!Array.isArray(hist))throw new Error(`${p.id} 提交紀錄格式不正確`);
 return hist.map((h,idx)=>{if(!isPlainObject(h))throw new Error(`${p.id} 第 ${idx+1} 筆紀錄格式不正確`);return {time:safeText(h.time,'時間',80),filename:safeText(h.filename,'檔名',255),score:scoreValue(h.score,maxScore,true),verdict:safeText(h.verdict,'Verdict',120)};});
}
function normalizeOneMode(raw,mode){
 if(raw==null)return emptyModeState();if(!isPlainObject(raw))throw new Error(`${mode} 紀錄格式不正確`);
 const out=emptyModeState(),known=new Set(EXAM.problems.map(p=>p.id));
 for(const section of ['best','latest','history']){const obj=raw[section];if(obj!=null&&!isPlainObject(obj))throw new Error(`${mode}.${section} 格式不正確`);if(obj)for(const id of Object.keys(obj))if(!known.has(id))throw new Error('紀錄包含不屬於本考卷的題目');}
 for(const p of EXAM.problems){
   const maxScore=modeMaxScore(p,mode);let best=0;
   if(raw.best&&raw.best[p.id]!=null)best=scoreValue(raw.best[p.id],maxScore);
   const latest=normalizeLatest(raw.latest&&raw.latest[p.id],p,maxScore);if(latest){out.latest[p.id]=latest;if(latest.score!=null)best=Math.max(best,latest.score);}
   const hist=normalizeHistory(raw.history&&raw.history[p.id],p,maxScore);if(hist.length){out.history[p.id]=hist;for(const h of hist)if(h.score!=null)best=Math.max(best,h.score);}
   if(best>0)out.best[p.id]=best;
 }
 return out;
}
function normalizeLastSource(raw){
 if(raw==null)return {};if(!isPlainObject(raw))throw new Error('最近上傳檔案格式不正確');
 const out={},known=new Set(EXAM.problems.map(p=>p.id));
 for(const [id,v] of Object.entries(raw)){
   if(!known.has(id)||!isPlainObject(v))throw new Error('最近上傳檔案包含不合法題目');
   const code=safeText(v.code,'程式碼',MAX_FILE_BYTES*2);if(new Blob([code]).size>MAX_FILE_BYTES)throw new Error(`${id} 程式碼超過大小限制`);
   out[id]={time:safeText(v.time||'','時間',80),filename:safeText(v.filename,'檔名',255),code};
 }
 return out;
}
function normalizeImportedState(raw,schemaVersion=RECORD_SCHEMA_VERSION){
 if(!isPlainObject(raw))throw new Error('紀錄內容格式不正確');
 if(schemaVersion===LEGACY_RECORD_SCHEMA_VERSION){
   const out=emptyState();out.modes[MODE_GRADING]=normalizeOneMode(raw,MODE_GRADING);out.lastSource=normalizeLastSource(inferLastSourceFromLegacy(raw.latest));return out;
 }
 if(schemaVersion!==RECORD_SCHEMA_VERSION)throw new Error('紀錄格式或版本不相容');
 if(!isPlainObject(raw.modes))throw new Error('紀錄缺少 modes');
 return {modes:{[MODE_GENERAL]:normalizeOneMode(raw.modes[MODE_GENERAL],MODE_GENERAL),[MODE_GRADING]:normalizeOneMode(raw.modes[MODE_GRADING],MODE_GRADING)},lastSource:normalizeLastSource(raw.lastSource)};
}
function recordEnvelope(){return {format:RECORD_FORMAT,schemaVersion:RECORD_SCHEMA_VERSION,exam:{id:EXAM.exam.id,title:EXAM.exam.title,storageNamespace:storageKey()},exportedAt:new Date().toISOString(),state:STATE};}
function recordFileName(){const safe=EXAM.exam.title.replace(/[\\/:*?"<>|]+/g,'_').replace(/\s+/g,'_');const d=new Date(),pad=n=>String(n).padStart(2,'0');return `${safe}_紀錄_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.json`;}
function exportRecords(){
 if(judging){toast('評測進行中，請稍後再操作紀錄');return;}
 const blob=new Blob([JSON.stringify(recordEnvelope(),null,2)+'\n'],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=recordFileName();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),0);toast('已匯出紀錄');
}
async function importRecords(file){
 if(judging){toast('評測進行中，請稍後再操作紀錄');return;}if(!file)return;if(file.size>MAX_RECORD_FILE_BYTES){toast('紀錄檔過大');return;}
 let obj;try{obj=JSON.parse(await file.text());}catch(e){toast('無法讀取紀錄檔');return;}
 try{
   if(obj.format!==RECORD_FORMAT||![LEGACY_RECORD_SCHEMA_VERSION,RECORD_SCHEMA_VERSION].includes(obj.schemaVersion))throw new Error('紀錄格式或版本不相容');
   if(!obj.exam||obj.exam.id!==EXAM.exam.id||obj.exam.storageNamespace!==storageKey())throw new Error('這不是本模擬考的紀錄檔');
   const next=normalizeImportedState(obj.state,obj.schemaVersion);
   if(!confirm('匯入紀錄會取代目前這份模擬考的本機作答紀錄。確定要繼續嗎？'))return;

function setTheme(theme){document.documentElement.dataset.theme=theme;document.documentElement.style.colorScheme=theme;$('#themeBtn').textContent=theme==='dark'?'淺色模式':'深色模式';try{localStorage.setItem(storageKey()+':theme',theme);}catch(e){}}

function overallBest(){const mode=currentMode(),ms=STATE.modes[mode];return EXAM.problems.reduce((sum,p)=>sum+Math.min(Number(ms.best[p.id]||0),modeMaxScore(p,mode)),0);}

// Derive feedback from the displayed problem/mode; never store color as learner data.
function verdictCode(value){const match=/^(AC|WA|CE|RE|TLE|JE)(?:\b|\s|\/)/.exec(String(value||''));return match?match[1]:'';}
function latestVerdict(p,mode=currentMode()){
 const ms=STATE.modes[mode],latest=ms.latest[p.id];
 if(!latest)return 'IDLE';
 if(latest.score==null||latest.errorKind==='environment')return 'JE';
 if(Number(latest.score)===modeMaxScore(p,mode))return 'AC';
 let code=verdictCode(latest.verdict);
 if(code&&code!=='AC')return code;
 const history=(ms.history[p.id]||[]).find(h=>h.time===latest.time&&h.filename===latest.filename&&h.score===latest.score);
 code=verdictCode(history&&history.verdict);
 if(code&&code!=='AC')return code;
 // Legacy schema 1/2 has no latest.verdict; retain its result without changing scores.
 const summary=String(latest.summary||'');
 for(const token of ['CE','TLE','RE'])if(new RegExp('\\b'+token+'\\b').test(summary))return token;
 return latest.errorKind?'RE':'WA';
}
function syncTabVerdicts(){
 const mode=currentMode(),ms=STATE.modes[mode];
 document.querySelectorAll('#problemTabs .problem-tab').forEach((button,i)=>{
   const p=EXAM.problems[i];if(!p)return;
   const accepted=Number(ms.best[p.id]||0)===modeMaxScore(p,mode);
   button.classList.toggle('is-ac',accepted);button.dataset.verdict=accepted?'AC':'NONE';
   let badge=button.querySelector('.problem-tab-verdict');
   if(!badge){badge=document.createElement('span');badge.className='problem-tab-verdict';badge.textContent='AC';badge.setAttribute('aria-hidden','true');button.appendChild(badge);}
   badge.hidden=!accepted;
   const label=`第 ${i+1} 題｜${p.title}`+(accepted?(mode===MODE_GENERAL?'｜公開範例 AC':'｜AC，已通過全部評測'):'');
   button.title=label;button.setAttribute('aria-label',label);
   if(i===activeIndex)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');
 });
}
function paintJudgeFeedback(verdict,percent,text){
 const line=$('#statusLine'),bar=$('#progressBar'),track=bar.parentElement;
 const value=Math.max(0,Math.min(100,Number(percent)||0));
 const style=verdict==='AC'?'good':['WA','CE','RE'].includes(verdict)?'bad':verdict==='TLE'?'warn':verdict==='JE'?'environment':'';
 line.className='status-line'+(style?' '+style:'');line.dataset.verdict=verdict;line.textContent=text;
 track.dataset.verdict=verdict;bar.dataset.verdict=verdict;bar.style.width=value+'%';
 track.setAttribute('aria-valuenow',String(value));
 const stateText=verdict==='RUNNING'?text:verdict==='IDLE'?'尚未提交':verdict==='JE'?'評測中止（JE），本次未評分':verdict==='TLE'?'評測已終止（TLE），未繼續後續測試':verdict==='CE'?'編譯失敗（CE），未執行測試':`評測已結束（${verdict}）`;
 track.setAttribute('aria-valuetext',stateText);track.title=stateText;
 $('#statusLine').setAttribute('aria-busy',verdict==='RUNNING'?'true':'false');
}
function renderJudgeFeedback(){
 const p=EXAM.problems[activeIndex],mode=currentMode(),latest=STATE.modes[mode].latest[p.id];
 if(activeJudgeView&&activeJudgeView.problemId===p.id&&activeJudgeView.mode===mode){
   const run=activeJudgeView;paintJudgeFeedback('RUNNING',run.completed/run.total*100,run.text);return;
 }
 const verdict=latestVerdict(p,mode);
 const text=latest?latest.summary:STATE.lastSource[p.id]?'目前沒有提交結果；可按「提交」評測已上傳的檔案。':'尚未提交檔案。';
 // A terminal strip denotes the submission lifecycle has ended, not the pass rate.
 paintJudgeFeedback(verdict,latest?100:0,text);
}

function renderTabs(){const box=$('#problemTabs');box.innerHTML='';EXAM.problems.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.className='problem-tab'+(i===activeIndex?' active':'');b.textContent=`第 ${i+1} 題｜${p.title}`;b.addEventListener('click',()=>{closeReferenceAnswer();activeIndex=i;renderAll();});box.appendChild(b);});}
function renderTextList(title,items,ordered=false){const tag=ordered?'ol':'ul';return `<section class="section"><h2>${escapeHtml(title)}</h2><${tag}>${items.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</${tag}></section>`;}
function renderSamples(p){return `<section class="section"><h2>範例測資</h2><div class="sample-list">${p.samples.map((s,i)=>`<section class="sample-card"><div class="sample-head"><h3>範例 #${i+1}</h3><button type="button" class="copy-btn sample-copy" data-sample="${i}">複製範例輸入</button></div><div class="sample-io"><div class="io-box"><div class="io-label">輸入</div><pre class="codeblock">${escapeHtml(s.input)}</pre></div><div class="io-box"><div class="io-label">輸出</div><pre class="codeblock">${escapeHtml(s.output)}</pre></div></div></section>`).join('')}</div></section>`;}
function renderProblem(){const p=EXAM.problems[activeIndex];$('#problemPane').innerHTML=`<div class="kicker">第 ${activeIndex+1} 題</div><h2 class="problem-title">${escapeHtml(p.title)}</h2><section class="section"><h2>問題描述</h2>${p.statement.map(x=>`<p>${escapeHtml(x)}</p>`).join('')}</section>${renderTextList('輸入格式',p.input)}${renderTextList('輸出格式',p.output)}${renderTextList('資料範圍',p.constraints)}${renderSamples(p)}`;
 document.querySelectorAll('.sample-copy').forEach(btn=>btn.addEventListener('click',()=>copyText(p.samples[Number(btn.dataset.sample)].input)));
}

function fmtTime(ts){try{return new Date(ts).toLocaleString('zh-TW',{hour12:false});}catch(e){return ts;}}
function closeReferenceAnswer(){const modal=$('#referenceModal');if(modal&&!modal.hidden){modal.hidden=true;$('#referenceCode').textContent='';}}

 if(currentMode()!==MODE_GRADING){closeReferenceAnswer();return;}
 const p=EXAM.problems[activeIndex],ref=p.referenceAnswer;

function renderSubmit(){
 const p=EXAM.problems[activeIndex],mode=currentMode(),ms=STATE.modes[mode],maxScore=modeMaxScore(p,mode),latest=ms.latest[p.id],hist=ms.history[p.id]||[],source=STATE.lastSource[p.id];
 $('#submitTitle').textContent=`第 ${activeIndex+1} 題繳交｜${p.title}`;
 $('#bestScore').textContent=`${ms.best[p.id]||0}/${maxScore}`;
 $('#latestScore').textContent=latest?(latest.score==null?'JE':`${latest.score}/${maxScore}`):'尚未提交';
 $('#overallScore').textContent=`${overallBest()}/${examMaxScore(mode)}`;
 if(source){$('#viewerName').textContent=source.filename;$('#codeViewer').textContent=source.code;$('#codeViewer').classList.remove('empty-code');$('#copyCodeBtn').disabled=false;}else{$('#viewerName').textContent='尚未上傳檔案';$('#codeViewer').textContent='上傳 .py 後會在這裡顯示檔案內容。此區只能檢視與複製，不能編輯。';$('#codeViewer').classList.add('empty-code');$('#copyCodeBtn').disabled=true;}
 if(latest){$('#statusLine').className='status-line '+(latest.score===maxScore?'good':latest.errorKind?'bad':'');$('#statusLine').textContent=latest.summary;}else{$('#statusLine').className='status-line';$('#statusLine').textContent=source?'目前沒有提交結果；可按「提交」評測已上傳的檔案。':'尚未提交檔案。';}
 $('#historyList').innerHTML=hist.length?hist.map(h=>`<div class="history-row"><div><strong>${escapeHtml(h.filename)}</strong><br><small>${escapeHtml(fmtTime(h.time))}｜${escapeHtml(h.verdict)}</small></div><strong>${h.score==null?'JE':`${h.score}/${maxScore}`}</strong></div>`).join(''):'<div class="history-row"><small>尚無提交紀錄</small><span></span></div>';
 const referenceBtn=$('#referenceAnswerBtn');referenceBtn.hidden=mode!==MODE_GRADING;referenceBtn.disabled=judging;
 if(mode!==MODE_GRADING)closeReferenceAnswer();
 $('#uploadBtn').disabled=judging;$('#resubmitBtn').disabled=judging||!source;$('#modeKeyInput').disabled=judging;syncTabVerdicts();renderJudgeFeedback();
}
function renderAll(){renderTabs();renderProblem();renderSubmit();}
function updateRuntime(){}
function terminateWorker(){if(pyWorker)pyWorker.terminate();pyWorker=null;workerReadyPromise=null;}
function makeWorker(){const src=`
let pyodide=null;let compiled=null;let seq=0;
const BASE=${JSON.stringify('https://cdn.jsdelivr.net/pyodide/v0.27.7/full/')};
async function init(){importScripts(BASE+'pyodide.js');pyodide=await loadPyodide({indexURL:BASE});postMessage({type:'ready'});}
function setg(name,val){pyodide.globals.set(name,val);}
function parseWorkerJson(value,label){
 if(typeof value!=='string')throw new Error(label+' returned a non-string result');
 try{return JSON.parse(value);}catch(_){throw new Error(label+' returned malformed JSON');}
}
self.onmessage=async(e)=>{const m=e.data||{};try{
 if(m.type==='init'){await init();return;}
 if(m.type==='prepare'){setg('__OJ_CODE__',m.code);const res=pyodide.runPython(\`
import json, traceback
try:
    __OJ_COMPILED__ = compile(__OJ_CODE__, 'main.py', 'exec')
    _oj_result = {'ok': True}
except BaseException:
    _oj_result = {'ok': False, 'error': traceback.format_exc(limit=8)}
json.dumps(_oj_result)
\`);postMessage({type:'reply',id:m.id,data:parseWorkerJson(res,'prepare')});return;}
 if(m.type==='run'){setg('__OJ_INPUT__',m.input);const res=await pyodide.runPythonAsync(\`
import sys, io, json, traceback
class _LimitedWriter(io.StringIO):
    def __init__(self, limit=200000):
        super().__init__(); self.limit=limit
    def write(self, s):
        if self.tell()+len(s)>self.limit:
            raise RuntimeError('Output limit exceeded')
        return super().write(s)
_oldin,_oldout,_olderr=sys.stdin,sys.stdout,sys.stderr
_out=_LimitedWriter(); _err=_LimitedWriter()
sys.stdin=io.StringIO(__OJ_INPUT__);sys.stdout=_out;sys.stderr=_err
_ok=True;_error=''
try:
    _ns={'__name__':'__main__','__file__':'main.py'}
    exec(__OJ_COMPILED__,_ns,_ns)
except SystemExit as e:
    if e.code not in (None,0):
        _ok=False; _error='SystemExit: '+str(e.code)
except BaseException:
    _ok=False; _error=traceback.format_exc(limit=8)
finally:
    sys.stdin,sys.stdout,sys.stderr=_oldin,_oldout,_olderr
json.dumps({'ok':_ok,'output':_out.getvalue(),'stderr':_err.getvalue(),'error':_error})
\`);postMessage({type:'reply',id:m.id,data:parseWorkerJson(res,'run')});return;}
 }catch(err){postMessage({type:'reply',id:m.id,data:{ok:false,error:String(err),environmentError:true}});}
};`;
 const url=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));const w=new Worker(url);URL.revokeObjectURL(url);return w;}
function ensureWorker(){if(pyWorker&&workerReadyPromise)return workerReadyPromise;pyWorker=makeWorker();const w=pyWorker;workerReadyPromise=new Promise((resolve,reject)=>{let done=false;const makeJe=msg=>{const err=new Error(msg);err.code='JE';return err;};const timer=setTimeout(()=>{if(done)return;done=true;terminateWorker();reject(makeJe('Python runtime 載入逾時'));},RUNTIME_INIT_TIMEOUT_MS);const onMsg=e=>{if(e.data&&e.data.type==='ready'&&!done){done=true;clearTimeout(timer);w.removeEventListener('message',onMsg);resolve();}};w.addEventListener('message',onMsg);w.addEventListener('error',e=>{if(!done){done=true;clearTimeout(timer);reject(makeJe(e.message||'Python runtime 載入失敗'));}});w.postMessage({type:'init'});});return workerReadyPromise;}
async function workerCall(type,data,timeoutMs){await ensureWorker();const w=pyWorker;if(!w){const err=new Error('Python runtime unavailable');err.code='JE';throw err;}const id=++workerSeq;return new Promise((resolve,reject)=>{let settled=false;const timer=setTimeout(()=>{if(settled)return;settled=true;w.removeEventListener('message',onMsg);terminateWorker();const err=new Error('Time Limit Exceeded');err.code='TLE';reject(err);},timeoutMs);function onMsg(e){const m=e.data||{};if(m.type==='reply'&&m.id===id&&!settled){settled=true;clearTimeout(timer);w.removeEventListener('message',onMsg);resolve(m.data);}}w.addEventListener('message',onMsg);w.postMessage({type,id,...data});});}
function sameOutput(a,b){const toks=s=>String(s).trim().split(/\s+/).filter(Boolean);const x=toks(a),y=toks(b);if(x.length!==y.length)return false;for(let i=0;i<x.length;i++)if(x[i]!==y[i])return false;return true;}
async function judgeSubmission(p,filename,code){
 if(judging)return;
 const mode=currentMode(),tests=modeTests(p,mode),maxScore=modeMaxScore(p,mode),ms=STATE.modes[mode];
 const problemNumber=EXAM.problems.findIndex(x=>x.id===p.id)+1;
 activeJudgeView={problemId:p.id,mode,completed:0,total:tests.length,text:'正在準備 Python 評測環境…'};
 judging=true;renderSubmit();updateRuntime('Python：載入中');
 let passed=0,wa=0,ce=0,re=0,tle=0,firstError='',je=false;
 try{
   const prep=await workerCall('prepare',{code},RUNTIME_INIT_TIMEOUT_MS);updateRuntime('Python：已就緒');
   if(prep.environmentError){const err=new Error(prep.error||'Judge environment error');err.code='JE';throw err;}
   if(!prep.ok){firstError=(prep.error||'編譯失敗').trim().split('\n').slice(-3).join(' | ');throw Object.assign(new Error(firstError),{code:'CE'});}
   for(let i=0;i<tests.length;i++){
     const t=tests[i];activeJudgeView.text=`評測中 ${i+1}/${tests.length}…目前通過 ${passed} 筆`;renderJudgeFeedback();
     let r;
     try{r=await workerCall('run',{input:t.input},PER_TEST_TIMEOUT_MS);}catch(e){if(e.code==='TLE'){tle++;firstError=firstError||`第 ${i+1} 筆執行逾時`;break;}throw e;}
     if(r.environmentError){const err=new Error(r.error||'Judge environment error');err.code='JE';throw err;}
     activeJudgeView.completed=i+1;
     if(!r.ok){re++;if(!firstError)firstError=(r.error||r.stderr||'Runtime Error').trim().split('\n').slice(-2).join(' | ');renderJudgeFeedback();continue;}
     if(sameOutput(r.output,t.output))passed++;else wa++;
     renderJudgeFeedback();
   }
 }catch(e){
   if(e.code==='CE'){ce=1;}
   else if(e.code==='TLE'){tle=Math.max(tle,1);}
   else if(e.code==='JE'){je=true;firstError=firstError||String(e.message||e);updateRuntime('Python：環境錯誤','bad');}
   else{je=true;firstError=firstError||String(e.message||e);updateRuntime('Python：環境錯誤','bad');}
 }
 const now=new Date().toISOString();
 if(je){
   const summary=`本次提交未評分（JE）：${firstError||'評測環境錯誤'}。請稍後重新提交；本題最佳分數不會被改動。`;
   const rec={time:now,filename,score:null,verdict:'JE'};
   ms.latest[p.id]={time:now,filename,score:null,code,summary,errorKind:'environment',verdict:'JE'};
   ms.history[p.id]=[rec,...(ms.history[p.id]||[])];
   saveState();activeJudgeView=null;judging=false;renderAll();toast(`第 ${problemNumber} 題評測環境錯誤（JE）`);return;
 }
 const score=passed;let verdict=score===maxScore?'AC':ce?'CE':tle?'TLE / 部分通過':re?'RE / 部分通過':'WA / 部分通過';let summary=`本次 ${score}/${maxScore} 分；通過 ${passed}/${tests.length} 筆。`;
 if(ce)summary+=' CE。';if(wa)summary+=` WA ${wa} 筆。`;if(re)summary+=` RE ${re} 筆。`;if(tle)summary+=` TLE ${tle} 筆。`;if(firstError&&(ce||re))summary+=` ${firstError}`;
 const rec={time:now,filename,score,verdict};ms.best[p.id]=Math.max(Number(ms.best[p.id]||0),score);ms.latest[p.id]={time:now,filename,score,code,summary,errorKind:(ce||re||tle)?'error':'',verdict};ms.history[p.id]=[rec,...(ms.history[p.id]||[])];saveState();activeJudgeView=null;judging=false;renderAll();
 toast(`第 ${problemNumber} 題本次 ${score}/${maxScore} 分`);
}
async function handleFile(file){const p=EXAM.problems[activeIndex];if(judging)return;if(!file)return;if(!file.name.toLowerCase().endsWith('.py')){toast('只接受 .py 檔案');return;}if(file.size>MAX_FILE_BYTES){toast('檔案過大，請控制在 128 KB 內');return;}let code='';try{code=await file.text();}catch(e){toast('無法讀取檔案');return;}if(!code.trim()){toast('檔案內容是空的');return;}STATE.lastSource[p.id]={time:new Date().toISOString(),filename:file.name,code};saveState();renderSubmit();await judgeSubmission(p,file.name,code);}
async function resubmitCurrentSource(){const p=EXAM.problems[activeIndex],source=STATE.lastSource[p.id];if(judging)return;if(!source){toast('請先上傳 .py 檔案');return;}await judgeSubmission(p,source.filename,source.code);}
function syncModeKey(){const input=$('#modeKeyInput'),raw=String(input.value||'').slice(0,4);if(input.value!==raw)input.value=raw;modeKeyValue=raw;$('#modeKeyMask').textContent=MODE_KEY_PROXY.slice(0,raw.length);$('.mode-key-wrap').classList.toggle('has-value',raw.length>0);saveModePreference(currentMode());renderSubmit();}
function initUpload(){const input=$('#fileInput'),btn=$('#uploadBtn'),resubmit=$('#resubmitBtn'),zone=$('#uploadZone');btn.addEventListener('click',()=>input.click());resubmit.addEventListener('click',resubmitCurrentSource);input.addEventListener('change',async()=>{const f=input.files&&input.files[0];input.value='';await handleFile(f);});['dragenter','dragover'].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.add('drag');}));['dragleave','drop'].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.remove('drag');}));zone.addEventListener('drop',async e=>{const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];await handleFile(f);});}
function init(){probeStorage();STATE=loadState();initModePreference();initTheme();$('#examTitle').textContent=EXAM.exam.title;$('#examSubtitle').textContent=EXAM.exam.subtitle;$('#modeKeyInput').addEventListener('input',syncModeKey);$('#themeBtn').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));$('#exportRecordsBtn').addEventListener('click',exportRecords);$('#importRecordsBtn').addEventListener('click',()=>$('#recordImportInput').click());$('#recordImportInput').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];e.target.value='';await importRecords(f);});$('#clearRecordsBtn').addEventListener('click',clearRecords);$('#copyCodeBtn').addEventListener('click',()=>{const p=EXAM.problems[activeIndex],source=STATE.lastSource[p.id];if(source)copyText(source.code);});$('#referenceAnswerBtn').addEventListener('click',openReferenceAnswer);$('#copyReferenceBtn').addEventListener('click',()=>{if(currentMode()!==MODE_GRADING)return;const p=EXAM.problems[activeIndex],ref=p.referenceAnswer;if(ref&&typeof ref.code==='string')copyText(ref.code);});$('#closeReferenceBtn').addEventListener('click',closeReferenceAnswer);$('#referenceBackdrop').addEventListener('click',closeReferenceAnswer);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeReferenceAnswer();});initUpload();renderAll();}
init();
